# dotindot.in — the public website, served as static files from /var/www/dotindot.in
# (built and copied there by website/deploy-website.sh).
#
# Install once on the VPS:
#   sudo cp /var/www/dotindot/website/deploy/nginx-dotindot.in.conf /etc/nginx/sites-available/dotindot.in
#   sudo ln -sf /etc/nginx/sites-available/dotindot.in /etc/nginx/sites-enabled/dotindot.in
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dotindot.in -d www.dotindot.in --redirect
# certbot adds the HTTPS lines and the http→https redirect to the blocks below.

# hashed scripts, fonts and images never change: cache them for a year; pages for 10 minutes
map $uri $dotindot_cache {
    ~*\.(?:js|json|woff2|svg|png|jpg|jpeg|webp|avif|ico)$ "public, max-age=31536000, immutable";
    default                                                "public, max-age=600, must-revalidate";
}

# www.dotindot.in → dotindot.in (one address for search engines)
server {
    listen 80;
    listen [::]:80;
    server_name www.dotindot.in;
    location / { return 301 https://dotindot.in$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name dotindot.in;

    root /var/www/dotindot.in;
    index index.html;
    charset utf-8;
    server_tokens off;

    # addresses from the previous site
    rewrite ^/locations(/.*)?$ /about/ permanent;
    rewrite ^/work/?$ /process/ permanent;
    rewrite ^/thank-you/?$ /thanks/ permanent;

    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known/) { deny all; }
    location = /manifest.webmanifest { default_type application/manifest+json; }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/manifest+json;

    add_header Cache-Control $dotindot_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
