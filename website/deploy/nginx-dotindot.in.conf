# dotindot.in — public website (static files built by website/deploy-website.sh)
# Install:  sudo cp website/deploy/nginx-dotindot.in.conf /etc/nginx/sites-available/dotindot.in
#           sudo ln -s /etc/nginx/sites-available/dotindot.in /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d dotindot.in -d www.dotindot.in --redirect
server {
    listen 80;
    listen [::]:80;
    server_name dotindot.in www.dotindot.in;

    root /var/www/dotindot.in;
    index index.html;

    # one address for search engines: https://dotindot.in
    if ($host = www.dotindot.in) { return 301 https://dotindot.in$request_uri; }

    # old site addresses
    rewrite ^/locations(/.*)?$ /about/ permanent;
    rewrite ^/work/?$ /process/ permanent;
    rewrite ^/thank-you/?$ /thanks/ permanent;

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    # hashed scripts, fonts and images never change: cache for a year
    location ~* \.(?:js|json|woff2|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:html|xml|txt|webmanifest)$ {
        add_header Cache-Control "public, max-age=600, must-revalidate";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/manifest+json;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
